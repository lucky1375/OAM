server:
  port: 8090

spring:
  datasource:
    url: jdbc:h2:file:./data/oam-db
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  jwt:
    secret: "PRIVATE_OAM_JWT_SECRET_CHANGE_ME_IN_PRODUCTION_0123456789abcdef"
    # token 有效期（毫秒），默认 24 小时
    expiration: 86400000
  cors:
    allowed-origins: http://localhost:8081,http://localhost:8082
