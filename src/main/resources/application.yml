server:
  port: 8081

spring:
  datasource:
    url: jdbc:h2:file:./data/oam-db
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
  autoconfigure:
    # Activiti 7 默认按 Spring Security 的 UserDetailsService 生成用户组管理器，
    # 本项目使用 JWT 自定义认证、无该 Bean，改用 ActivitiConfig 中提供的 UserGroupManager
    exclude:
      - org.activiti.core.common.spring.identity.config.ActivitiSpringIdentityAutoConfiguration
  activiti:
    database-schema-update: true
    # 必须显式开启，否则 Activiti 只建 ACT_RU_*/ACT_RE_* 引擎表，不建 ACT_HI_* 历史表，流程提交会报表不存在
    db-history-used: true
    # full 级别会写 ACT_HI_DETAIL 变量明细，审批流转用 audit 已足够
    history-level: audit
    async-executor-activate: false
    check-process-definitions: true
    process-definition-location-prefix: classpath*:/processes/
    security:
      enabled: false

app:
  jwt:
    secret: "PRIVATE_OAM_JWT_SECRET_CHANGE_ME_IN_PRODUCTION_0123456789abcdef"
    # token 有效期（毫秒），默认 24 小时
    expiration: 86400000
  cors:
    allowed-origins: http://localhost:8080

# 考勤打卡：百度地图定位 + 打卡点围栏校验
oam:
  baidu-map:
    # 百度地图 JS API AK，配置后前端使用 BMap.Geolocation 定位；为空则降级为浏览器定位并转换坐标
    ak: "bt7Ql42HTIKd9JpEEiNyn7YbIGcurQPA"
  attendance:
    office:
      name: 公司总部
      # 打卡点坐标（百度 BD09 坐标系，可在百度拾取坐标系统获取）
      latitude: 39.908823
      longitude: 116.397470
      # 允许打卡半径（米）
      radius: 500
